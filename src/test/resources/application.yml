# 단위 테스트: 로컬 .env 없이 컨텍스트 기동 (인메모리 H2)
spring:
  datasource:
    url: jdbc:h2:mem:testgis;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

jwt:
  secret: test-jwt-secret-key-for-unit-tests-32b!
  expiration: 86400000

seoul:
  open-api:
    key: test-seoul-key
    base-url: http://openapi.seoul.go.kr:8088
    district-living-population-service-name: SPOP_LOCAL_RESD_PPLTN
